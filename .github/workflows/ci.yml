name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint and build on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.19', '22.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit dependencies for high or critical advisories
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Upload build artifact
        if: matrix.node-version == '22.12'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
